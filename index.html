<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지하철 구간 거리 측정기 (8호선 연장 반영)</title>
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f4f7fa; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 25px; font-size: 1.6rem; letter-spacing: -1px; }
        .station-row { background: #fdfdfd; padding: 18px; border-radius: 12px; border: 1px solid #edf0f3; margin-bottom: 15px; position: relative; }
        .row-top { display: flex; align-items: center; gap: 12px; }
        .label { font-weight: 700; width: 60px; color: #555; font-size: 0.95rem; }
        .input-group { flex: 1; display: flex; align-items: center; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary-color); }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 15px; margin-top: 10px; cursor: pointer; }
        .suffix { font-weight: 600; color: #222; }
        .add-btn-wrapper { text-align: center; margin: -5px 0 15px 0; }
        .add-btn { background: #f0f4f8; color: var(--primary-color); border: 1px solid #dce4ec; width: 100%; max-width: 220px; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .calc-btn { background: var(--primary-color); color: white; padding: 16px; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; width: 100%; margin-top: 20px; cursor: pointer; }
        .remove-btn { position: absolute; top: 12px; right: 12px; background: #fff1f0; color: #ff4d4f; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        #result { margin-top: 25px; padding: 25px; border-radius: 15px; display: none; }
        .total-val { font-size: 24px; color: var(--primary-color); font-weight: 800; text-align: center; }
        .error-val { font-size: 16px; color: #ff4d4f; font-weight: 800; text-align: center; line-height: 1.6; }
        .detail-log { margin-top: 15px; font-size: 14px; color: #555; line-height: 1.8; border-top: 1px dotted #ccc; padding-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚇 지하철 거리 측정기</h2>
    <div id="route-container">
        <div class="station-row">
            <div class="row-top">
                <span class="label">출발</span>
                <div class="input-group">
                    <input type="text" class="st-name" placeholder="'역' 제외 (예: 별내)" oninput="handleInput(this)">
                    <span class="suffix">역</span>
                </div>
            </div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
        <div class="add-btn-wrapper"><button class="add-btn" onclick="addTransfer()">+ 환승역 추가</button></div>
        <div id="transfer-area"></div>
        <div class="station-row">
            <div class="row-top">
                <span class="label">도착</span>
                <div class="input-group">
                    <input type="text" class="st-name" placeholder="'역' 제외 (예: 석남)" oninput="handleInput(this)">
                    <span class="suffix">역</span>
                </div>
            </div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
    </div>
    <button class="calc-btn" onclick="calculate()">전체 이동 거리 측정</button>
    <div id="result"></div>
</div>

<script>
const subwayData = {
    "1호선": {"연천":0,"전곡":8.7,"청산":12.0,"소요산":17.8,"의정부":42.1,"도봉산":47.4,"창동":51.6,"청량리":60.5,"신설동":62.4,"종로3가":65.4,"서울역":68.3,"노량진":73.9,"신길":76.2,"신도림":78.8,"구로":79.9,"오류동":83.6,"온수":85.5,"부평":94.7,"인천":106.4,"수원":110.9,"천안":165.3},
    "2호선": {"시청":0,"성수":8.9,"잠실":15.9,"강남":22.5,"교대":23.7,"사당":27.7,"낙성대":29.4,"서울대입구":30.1,"신림":32.2,"구로디지털단지":35.1,"신도림":37.3,"합정":42.5,"홍대입구":43.6,"신설동":54.2,"까치산":58.5},
    "3호선": {"대화":0,"삼송":17.8,"연신내":23.0,"불광":24.3,"종로3가":32.7,"고속터미널":42.9,"오금":57.2},
    "4호선": {"당고개":0,"창동":3.8,"서울역":19.0,"사당":28.8,"금정":42.8,"오이도":68.8},
    "5호선": {"방화":0,"김포공항":2.1,"화곡":7.7,"까치산":8.9,"신정":10.2,"목동":11.0,"양평":12.9,"신길":15.7,"여의도":16.7,"종로3가":25.3,"답십리":32.5,"천호":40.2,"오금":45.4},
    "6호선": {"신내":0,"봉화산":1.3,"화랑대":2.3,"태릉입구":3,"석계":3.9,"돌곶이":4.9,"상월곡":5.7,"월곡":6.5,"고려대":7.4,"안암":8.3,"보문":9.2,"창신":10,"동묘앞":11.5,"신당":12.1,"청구":12.8,"약수":13.5,"버티고개":14.2,"한강진":15.2,"이태원":16.2,"녹사평":17.3,"삼각지":18.2,"효창공원앞":19.3,"공덕":20.1,"대흥":21.1,"광흥창":22.2,"상수":23,"합정":23.8,"망원":24.6,"마포구청":25.8,"월드컵경기장":26.6,"디지털미디어시티":27.4,"증산":28.5,"새절":29.4,"응암":30.3,"역촌":31.4,"불광":32.2,"독바위":33.3,"연신내":34.2,"구산":35.1},
    "7호선": {"장암":0,"도봉산":1.4,"수락산":3,"마들":4.4,"노원":5.6,"중계":6.7,"하계":7.7,"공릉":9,"태릉입구":9.8,"먹골":10.7,"중화":11.6,"상봉":12.6,"면목":13.4,"사가정":14.3,"용마산":15.1,"중곡":16,"군자":17.1,"어린이대공원":18.2,"건대입구":19,"자양":20,"청담":22,"강남구청":23.1,"학동":24,"논현":25,"반포":25.9,"고속터미널":26.8,"내방":29,"이수":30,"남성":31,"숭실대입구":33,"상도":33.9,"장승배기":34.8,"신대방삼거리":36,"보라매":36.8,"신풍":37.7,"대림":39.1,"남구로":40.2,"가산디지털단지":41,"광명사거리":43.7,"천왕":45.4,"온수":46.9,"까치울":49.1,"부천종합운동장":50.2,"춘의":51.2,"신중동":52.2,"부천시청":53.3,"상동":54.2,"삼산체육관":55.1,"굴포천":56,"부평구청":56.9,"산곡":58.5,"석남":60.1},
    "8호선": {"별내":0,"다산":3.1,"동구릉":4.4,"구리":5.6,"장자호수공원":7.4,"암사역사공원":10.5,"암사":11.6,"천호":12.9,"강동구청":13.8,"잠실":16.2,"석촌":17.4,"가락시장":19.0,"모란":28.9}
};

const stationMap = {};
for (let line in subwayData) {
    for (let st in subwayData[line]) {
        if (!stationMap[st]) stationMap[st] = [];
        stationMap[st].push(line);
    }
}

function normalizeName(name) {
    let clean = name.trim();
    if (clean.endsWith("역")) clean = clean.substring(0, clean.length - 1);
    const mapping = {"서울": "서울역", "오류": "오류동", "서울대": "서울대입구", "디지털": "디지털미디어시티", "장자호수": "장자호수공원", "암사역사": "암사역사공원"};
    return mapping[clean] || clean;
}

function handleInput(input) {
    const stName = normalizeName(input.value);
    const row = input.closest('.station-row');
    const select = row.querySelector('.st-line');
    select.innerHTML = '<option value="">호선 선택</option>';
    if (stationMap[stName]) {
        stationMap[stName].forEach(line => {
            const opt = document.createElement('option');
            opt.value = line; opt.textContent = line;
            select.appendChild(opt);
        });
        if (stationMap[stName].length === 1) select.value = stationMap[stName][0];
    }
}

function addTransfer() {
    const area = document.getElementById('transfer-area');
    const div = document.createElement('div');
    div.className = 'station-row';
    div.innerHTML = `<button class="remove-btn" onclick="this.parentElement.remove()">삭제</button><div class="row-top"><span class="label">환승</span><div class="input-group"><input type="text" class="st-name" placeholder="'역' 제외 입력" oninput="handleInput(this)"><span class="suffix">역</span></div></div><select class="st-line"><option value="">호선 선택</option></select><div style="font-size:12px; color:#0056b3; margin-top:8px; text-align:center;">환승하신 이후에 해당하는 호선을 선택해주세요</div>`;
    area.appendChild(div);
}

function calculate() {
    const names = document.querySelectorAll('.st-name'), lines = document.querySelectorAll('.st-line');
    let total = 0, log = [], isError = false;
    const resBox = document.getElementById('result');
    resBox.style.display = 'block';

    for (let i = 0; i < names.length - 1; i++) {
        const s = normalizeName(names[i].value), e = normalizeName(names[i+1].value), l = lines[i].value;
        if (!s || !e || !l || !subwayData[l] || subwayData[l][s] === undefined || subwayData[l][e] === undefined) {
            isError = true; break;
        }
        const d = Math.abs(subwayData[l][e] - subwayData[l][s]);
        total += d;
        log.push(`📍 ${s} ➡ ${e} (${l}): ${d.toFixed(2)}km`);
    }

    if (isError) {
        resBox.style.background = "#fff1f0";
        resBox.innerHTML = `<div class="error-val">출발역과 도착역 이름을 확인해주세요!<br>'역'은 제외하고 입력해주세요</div>`;
    } else {
        resBox.style.background = "#f0f7ff";
        resBox.innerHTML = `<div class="total-val">총 이동 거리: ${total.toFixed(2)} km</div><div style="font-size:13px; margin-top:10px; line-height:1.6;">${log.join('<br>')}</div>`;
    }
}
</script>
</body>
</html>
