<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지하철 구간 거리 측정기</title>
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f4f7fa; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; color: #333; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; letter-spacing: -1px; }
        
        /* 모바일 대응 레이아웃 */
        .station-row { background: #fdfdfd; padding: 15px; border-radius: 12px; border: 1px solid #edf0f3; margin-bottom: 10px; position: relative; }
        .input-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; } /* 모바일 폰트 16px 권장 (자동줌 방지) */
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 15px; appearance: none; }
        
        .label { font-weight: 700; font-size: 0.9rem; color: #666; margin-bottom: 8px; display: block; }
        .suffix { font-weight: 600; color: #222; min-width: 20px; }
        
        .add-btn-wrapper { text-align: center; margin: 10px 0; }
        .add-btn { background: #f0f4f8; color: var(--primary-color); border: 1px solid #dce4ec; width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        
        .calc-btn { background: var(--primary-color); color: white; padding: 16px; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; width: 100%; margin-top: 15px; box-shadow: 0 4px 12px rgba(0,86,179,0.2); }
        
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #fff1f0; color: #ff4d4f; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; }
        
        #result { margin-top: 20px; padding: 20px; border-radius: 12px; display: none; }
        .total-val { font-size: 22px; color: var(--primary-color); font-weight: 800; text-align: center; }
        .error-val { font-size: 15px; color: #ff4d4f; font-weight: 700; text-align: center; line-height: 1.5; }
        .detail-log { margin-top: 15px; font-size: 13px; color: #555; line-height: 1.6; border-top: 1px dotted #ccc; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚇 지하철 거리 측정기</h2>
    <div id="route-container">
        <div class="station-row">
            <span class="label">출발역</span>
            <div class="input-group">
                <input type="text" class="st-name" placeholder="'역' 제외 (예: 인천)" oninput="handleInput(this)">
                <span class="suffix">역</span>
            </div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
        
        <div id="transfer-area"></div>

        <div class="add-btn-wrapper">
            <button class="add-btn" onclick="addTransfer()">+ 환승역 추가</button>
        </div>

        <div class="station-row">
            <span class="label">도착역</span>
            <div class="input-group">
                <input type="text" class="st-name" placeholder="'역' 제외 (예: 답십리)" oninput="handleInput(this)">
                <span class="suffix">역</span>
            </div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
    </div>

    <button class="calc-btn" onclick="calculate()">거리 계산하기</button>
    <div id="result"></div>
</div>

<script>
// 전수 데이터 추출본 (첨부파일 근거)
const subwayData = {
    "1": {"서울역":0.0,"시청":1.1,"종각":2.1,"종로3가":2.9,"종로5가":3.8,"동대문":4.6,"동묘앞":5.2,"신설동":5.9,"제기동":6.8,"청량리":7.8},
    "2": {"시청":0.0,"을지로입구":0.7,"을지로3가":1.5,"을지로4가":2.1,"동대문역사문화공원":3.1,"신당":4.0,"상왕십리":4.9,"왕십리":5.7,"성수":8.9,"건대입구":10.5,"잠실":15.9,"강남":22.5,"교대":23.7,"사당":27.7,"신림":32.2,"신도림":37.3,"영등포구청":39.4,"합정":42.5,"홍대입구":43.6},
    "3": {"지축":0.0,"연신내":3.5,"불광":4.8,"종로3가":13.2,"고속터미널":23.4,"양재":27.7,"오금":37.7},
    "4": {"당고개":0.0,"노원":2.4,"창동":3.8,"동대문":14.7,"서울역":19.0,"사당":28.8},
    "5": {"방화":0.0,"김포공항":2.1,"까치산":8.9,"영등포구청":13.8,"신길":15.8,"여의도":16.8,"공덕":20.4,"종로3가":25.4,"왕십리":30.8,"답십리":32.5,"군자":35.2,"천호":40.2,"오금":45.4},
    "6": {"응암":0.0,"불광":1.9,"연신내":3.9,"디지털미디어시티":7.7,"합정":11.1,"공덕":14.4,"신당":22.3,"동묘앞":22.9,"태릉입구":31.5},
    "7": {"도봉산":1.4,"노원":5.6,"태릉입구":9.8,"군자":17.1,"건대입구":19.0,"고속터미널":26.8,"대림":39.1,"온수":46.9},
    "8": {"암사":0.0,"천호":1.3,"잠실":4.6,"가락시장":7.4,"모란":17.3},
    "1(경인선)": {"신길":6.6,"영등포":7.7,"신도림":9.2,"구로":10.3,"온수":15.9,"부천":19.8,"부평":25.1,"주안":30.7,"인천":36.8},
    "1(경부선)": {"서울역":0.0,"용산":1.7,"노량진":4.3,"신길":6.6,"수원":28.6,"천안":83.0}
};

const stationLines = {};
for(let line in subwayData) {
    for(let st in subwayData[line]) {
        if(!stationLines[st]) stationLines[st] = [];
        stationLines[st].push(line);
    }
}

function normalizeName(name) {
    let clean = name.trim();
    if(clean.endsWith("역")) clean = clean.substring(0, clean.length - 1);
    if(clean === "서울") return "서울역";
    return clean;
}

function handleInput(input) {
    const stName = normalizeName(input.value);
    const row = input.closest('.station-row');
    const select = row.querySelector('.st-line');
    select.innerHTML = '<option value="">호선 선택</option>';
    if(stationLines[stName]) {
        stationLines[stName].forEach(line => {
            const opt = document.createElement('option');
            opt.value = line; opt.textContent = line + '호선';
            select.appendChild(opt);
        });
        if(stationLines[stName].length === 1) select.value = stationLines[stName][0];
    }
}

function addTransfer() {
    const area = document.getElementById('transfer-area');
    const div = document.createElement('div');
    div.className = 'station-row';
    div.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">삭제</button>
        <span class="label">환승역</span>
        <div class="input-group">
            <input type="text" class="st-name" placeholder="'역' 제외 입력" oninput="handleInput(this)">
            <span class="suffix">역</span>
        </div>
        <select class="st-line"><option value="">호선 선택</option></select>
    `;
    area.appendChild(div);
}

function calculate() {
    const names = document.querySelectorAll('.st-name');
    const lines = document.querySelectorAll('.st-line');
    let total = 0; let log = []; let isError = false;
    const resBox = document.getElementById('result');
    resBox.style.display = 'block';

    for(let i = 0; i < names.length - 1; i++) {
        const s = normalizeName(names[i].value);
        const e = normalizeName(names[i+1].value);
        const l = lines[i].value;
        if(!s || !e || !l || !subwayData[l] || subwayData[l][s] === undefined || subwayData[l][e] === undefined) {
            isError = true; break;
        }
        const d = Math.abs(subwayData[l][e] - subwayData[l][s]);
        total += d;
        log.push(`📍 ${s} ➡ ${e} (${l}호선): ${d.toFixed(2)}km`);
    }

    if(isError) {
        resBox.style.background = "#fff1f0";
        resBox.innerHTML = `<div class="error-val">역 이름과 호선을 확인해주세요!<br>'역'은 제외하고 입력해야 합니다.</div>`;
    } else {
        resBox.style.background = "#f0f7ff";
        resBox.innerHTML = `<div class="total-val">총 거리: ${total.toFixed(2)} km</div><div class="detail-log">${log.join('<br>')}</div>`;
    }
}
</script>
</body>
</html>
