<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지하철 구간 거리 측정기</title>
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f4f7fa; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; font-size: 1.6rem; margin-bottom: 25px; letter-spacing: -1px; }
        .station-row { background: #fdfdfd; padding: 18px; border-radius: 12px; border: 1px solid #edf0f3; margin-bottom: 15px; position: relative; }
        .input-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary-color); }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 15px; }
        .label { font-weight: 700; font-size: 0.95rem; color: #555; margin-bottom: 8px; display: block; }
        .suffix { font-weight: 600; color: #222; }
        .hint-text { font-size: 12px; color: var(--primary-color); font-weight: 500; margin-top: 5px; }
        .add-btn-wrapper { text-align: center; margin: -5px 0 15px 0; }
        .add-btn { background: #f0f4f8; color: var(--primary-color); border: 1px solid #dce4ec; width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .calc-btn { background: var(--primary-color); color: white; padding: 16px; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; width: 100%; margin-top: 20px; cursor: pointer; }
        .remove-btn { position: absolute; top: 12px; right: 12px; background: #fff1f0; color: #ff4d4f; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        #result { margin-top: 25px; padding: 20px; border-radius: 15px; display: none; }
        .total-val { font-size: 24px; color: var(--primary-color); font-weight: 800; text-align: center; }
        .error-val { font-size: 17px; color: #ff4d4f; font-weight: 800; text-align: center; line-height: 1.6; }
        .detail-log { margin-top: 15px; font-size: 14px; color: #555; line-height: 1.8; border-top: 1px dotted #ccc; padding-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚇 지하철 거리 측정기</h2>
    <div id="route-container">
        <div class="station-row">
            <span class="label">출발</span>
            <div class="input-group">
                <input type="text" class="st-name" placeholder="'역' 제외 (예: 오류)" oninput="handleInput(this)">
                <span class="suffix">역</span>
            </div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
        
        <div class="add-btn-wrapper">
            <button class="add-btn" onclick="addTransfer()">+ 환승역 추가</button>
        </div>
        <div id="transfer-area"></div>

        <div class="station-row">
            <span class="label">도착</span>
            <div class="input-group">
                <input type="text" class="st-name" placeholder="'역' 제외 (예: 신길)" oninput="handleInput(this)">
                <span class="suffix">역</span>
            </div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
    </div>
    <button class="calc-btn" onclick="calculate()">전체 이동 거리 측정</button>
    <div id="result"></div>
</div>

<script>
// 모든 파일 데이터를 통합한 최종 DB
const subwayData = {
    "1(경인선)": {"서울역":0,"용산":3.4,"노량진":5.6,"대방":7.1,"신길":7.9,"영등포":9.0,"신도림":10.5,"구로":11.6,"구일":13.0,"개봉":14.0,"오류동":15.3,"온수":17.2,"인천":38.1},
    "2": {"시청":0,"신도림":37.3,"구로디지털단지":35.1,"강남":22.5,"교대":23.7,"잠실":15.9},
    "3": {"지축":0,"연신내":3.5,"종로3가":13.2,"양재":27.7,"오금":37.7},
    "3(일산선)": {"삼송":0,"대화":17.8},
    "4": {"당고개":0,"서울역":19.0,"사당":28.8},
    "4(과천/안산선)": {"선바위":0,"오이도":38.4},
    "5": {"김포공항":2.1,"신길":15.7,"여의도":16.7,"종로3가":25.4,"왕십리":30.8,"답십리":32.5,"군자":35.2,"천호":40.2,"오금":45.4},
    "7": {"노원":5.6,"고속터미널":26.8,"대림":39.1,"온수":46.9}
};

const stationMap = {};
for (let line in subwayData) {
    for (let st in subwayData[line]) {
        if (!stationMap[st]) stationMap[st] = [];
        stationMap[st].push(line);
    }
}

function normalizeName(name) {
    let clean = name.trim();
    if (clean.endsWith("역")) clean = clean.substring(0, clean.length - 1);
    if (clean === "서울") return "서울역";
    if (clean === "오류") return "오류동"; // 동네 이름 '오류동'으로 보정
    return clean;
}

function handleInput(input) {
    const stName = normalizeName(input.value);
    const row = input.closest('.station-row');
    const select = row.querySelector('.st-line');
    select.innerHTML = '<option value="">호선 선택</option>';
    if (stationMap[stName]) {
        stationMap[stName].forEach(line => {
            const opt = document.createElement('option');
            opt.value = line; opt.textContent = line + '호선';
            select.appendChild(opt);
        });
        if (stationMap[stName].length === 1) select.value = stationMap[stName][0];
    }
}

function addTransfer() {
    const area = document.getElementById('transfer-area');
    const div = document.createElement('div');
    div.className = 'station-row';
    div.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">삭제</button>
        <span class="label">환승</span>
        <div class="input-group">
            <input type="text" class="st-name" placeholder="'역' 제외 입력" oninput="handleInput(this)">
            <span class="suffix">역</span>
        </div>
        <select class="st-line"><option value="">호선 선택</option></select>
        <div class="hint-text">환승하신 이후에 해당하는 호선을 선택해주세요</div>
    `;
    area.appendChild(div);
}

    const lines = document.querySelectorAll('.st-line');
    let total = 0; let log = []; let isError = false;
