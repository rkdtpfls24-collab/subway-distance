<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지하철 거리 측정기 (전 노선 완결판)</title>
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f4f7fa; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 25px; font-size: 1.6rem; letter-spacing: -1px; }
        .station-row { background: #fdfdfd; padding: 18px; border-radius: 12px; border: 1px solid #edf0f3; margin-bottom: 15px; position: relative; }
        .row-top { display: flex; align-items: center; gap: 12px; }
        .label { font-weight: 700; width: 60px; color: #555; }
        .input-group { flex: 1; display: flex; align-items: center; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; width: 100%; outline: none; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 15px; margin-top: 10px; cursor: pointer; }
        .add-btn { background: #f0f4f8; color: var(--primary-color); border: 1px solid #dce4ec; width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; margin: 10px 0; }
        .calc-btn { background: var(--primary-color); color: white; padding: 16px; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; width: 100%; margin-top: 20px; cursor: pointer; }
        .remove-btn { position: absolute; top: 12px; right: 12px; color: #ff4d4f; border: none; background: none; cursor: pointer; font-size: 12px; }
        #result { margin-top: 25px; padding: 25px; border-radius: 15px; display: none; }
        .total-val { font-size: 24px; color: var(--primary-color); font-weight: 800; text-align: center; }
        .error-val { font-size: 16px; color: #ff4d4f; font-weight: 800; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <h2>🚇 지하철 거리 측정기</h2>
    <div id="route-container">
        <div class="station-row">
            <div class="row-top"><span class="label">출발</span><div class="input-group"><input type="text" class="st-name" placeholder="'역' 제외 (예: 소요산)" oninput="handleInput(this)"><span class="suffix">역</span></div></div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
        <button class="add-btn" onclick="addTransfer()">+ 환승역 추가</button>
        <div id="transfer-area"></div>
        <div class="station-row">
            <div class="row-top"><span class="label">도착</span><div class="input-group"><input type="text" class="st-name" placeholder="'역' 제외 (예: 인천)" oninput="handleInput(this)"><span class="suffix">역</span></div></div>
            <select class="st-line"><option value="">호선 선택</option></select>
        </div>
    </div>
    <button class="calc-btn" onclick="calculate()">전체 이동 거리 측정</button>
    <div id="result"></div>
</div>

    "5호선": "방화:0,개화산:0.9,김포공항:2.1,송정:3.3,마곡:4.4,발산:5.6,우장산:6.7,화곡:7.7,까치산:8.9,신정:10.2,목동:11,오목교:11.9,양평:12.9,영등포구청:13.7,영등포시장:14.6,신길:15.7,여의도:16.7,여의나루:17.7,마포:19.5,공덕:20.3,애오개:21.4,충정로:22.3,서대문:23,광화문:24.1,종로3가:25.3,을지로4가:26.3,동대문역사문화공원:27.2,청구:28.1,신금호:29,행당:29.8,왕십리:30.8,마장:31.5,답십리:32.5,장한평:33.7,군자:35.2,아차산:36.7,광나루:38.2,천호:40.2,강동:41,길동:41.8,굽은다리:42.6,명일:43.3,고덕:44.5,상일동:45.6,강일:46.3,미사:48,하남풍산:50.1,하남시청:51.5,하남검단산:52.2,둔촌동:42.2,올림픽공원:43.6,방이:44.5,오금:45.4,개롱:46.3,거여:47.2,마천:48.1",
    "7호선": "장암:0,도봉산:1.4,수락산:3,마들:4.4,노원:5.6,중계:6.7,하계:7.7,공릉:9,태릉입구:9.8,먹골:10.7,중화:11.6,상봉:12.6,면목:13.4,사가정:14.3,용마산:15.1,중곡:16,군자:17.1,어린이대공원:18.2,건대입구:19,자양:20,청담:22,강남구청:23.1,학동:24,논현:25,반포:25.9,고속터미널:26.8,내방:29,이수:30,남성:31,숭실대입구:33,상도:33.9,장승배기:34.8,신대방삼거리:36,보라매:36.8,신풍:37.7,대림:39.1,남구로:40.2,가산디지털단지:41,철산:42.4,광명사거리:43.7,천왕:45.4,온수:46.9,까치울:49.1,부천종합운동장:50.2,춘의:51.2,신중동:52.2,부천시청:53.3,상동:54.2,삼산체육관:55.1,굴포천:56,부평구청:56.9,산곡:58.5,석남:60.1",
    "8호선": "별내:0,다산:3.1,동구릉:4.4,구리:5.6,장자호수공원:7.4,암사역사공원:10.5,암사:11.6,천호:12.9,강동구청:13.8,몽촌토성:15.4,잠실:16.2,석촌:17.4,가락시장:19,문정:19.9,장지:20.8,복정:21.7,산성:24.4,남한산성입구:25.7,단대오거리:26.5,신흥:27.3,수진:28.2,모란:28.9"
};

const subwayData = {};
for (let line in rawData) {
    subwayData[line] = {};
    rawData[line].split(',').forEach(pair => {
        const [st, dist] = pair.split(':');
        subwayData[line][st] = parseFloat(dist);
    });
}

const stationMap = {};
for (let line in subwayData) {
    for (let st in subwayData[line]) {
        if (!stationMap[st]) stationMap[st] = [];
        stationMap[st].push(line);
    }
}

function normalizeName(name) {
    let clean = name.trim();
    if (clean.endsWith("역")) clean = clean.substring(0, clean.length - 1);
    const mapping = {"서울": "서울역", "오류": "오류동", "서울대": "서울대입구", "디지털": "디지털미디어시티", "장자호수": "장자호수공원", "암사역사": "암사역사공원", "별내별": "별내별가람", "당고개": "불암산", "원계": "월계"};
    return mapping[clean] || clean;
}

function handleInput(input) {
    const stName = normalizeName(input.value);
    const row = input.closest('.station-row');
    const select = row.querySelector('.st-line');
    select.innerHTML = '<option value="">호선 선택</option>';
    if (stationMap[stName]) {
        stationMap[stName].forEach(line => {
            const opt = document.createElement('option');
            opt.value = line; opt.textContent = line;
            select.appendChild(opt);
        });
        if (stationMap[stName].length === 1) select.value = stationMap[stName][0];
    }
}

function addTransfer() {
    const area = document.getElementById('transfer-area');
    const div = document.createElement('div');
    div.className = 'station-row';
    div.innerHTML = `<button class="remove-btn" onclick="this.parentElement.remove()">삭제</button><div class="row-top"><span class="label">환승</span><div class="input-group"><input type="text" class="st-name" placeholder="'역' 제외 입력" oninput="handleInput(this)"><span class="suffix">역</span></div></div><select class="st-line"><option value="">호선 선택</option></select><div style="font-size:12px; color:#0056b3; margin-top:8px; text-align:center;">환승하신 이후에 해당하는 호선을 선택해주세요</div>`;
    area.appendChild(div);
}

function calculate() {
    const names = document.querySelectorAll('.st-name'), lines = document.querySelectorAll('.st-line');
    let total = 0, log = [], isError = false;
    const resBox = document.getElementById('result');
    resBox.style.display = 'block';

    for (let i = 0; i < names.length - 1; i++) {
        const s = normalizeName(names[i].value), e = normalizeName(names[i+1].value), l = lines[i].value;
        if (!s || !e || !l || !subwayData[l] || subwayData[l][s] === undefined || subwayData[l][e] === undefined) {
            isError = true; break;
        }
        const d = Math.abs(subwayData[l][e] - subwayData[l][s]);
        total += d;
        log.push(`📍 ${s} ➡ ${e} (${l}): ${d.toFixed(2)}km`);
    }

    if (isError) {
        resBox.style.background = "#fff1f0";
        resBox.innerHTML = `<div class="error-val">출발역과 도착역 이름을 확인해주세요!<br>'역'은 제외하고 입력해주세요</div>`;
    } else {
        resBox.style.background = "#f0f7ff";
        resBox.innerHTML = `<div class="total-val">총 이동 거리: ${total.toFixed(2)} km</div><div style="font-size:13px; margin-top:10px; line-height:1.6;">${log.join('<br>')}</div>`;
    }
}
</script>
</body>
</html>
